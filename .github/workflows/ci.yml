name: CI

on:
  push:
    branches: [main]
  pull_request:

# The shared UI library (@punch-munkey/ui-web) lives in its own repo, and the local
# Yarn workspace root that links it isn't versioned anywhere. So this job
# checks out punch-munkey-ui-web next to this repo and writes a temporary workspace
# root listing just the two, the same way punch-munkey-host-portal's Dockerfile builds.
#
# If the sibling repo is private, add a repository secret named
# SIBLING_REPOS_TOKEN: a fine-grained token with read-only "Contents" access
# to santhoshsivakumarui-blip/punch-munkey-ui-web. Without it the default token is used, which only
# works if that repo is public.
#
# No lockfile is committed for this two-package workspace, so installs
# resolve the newest versions allowed by each package.json. A dependency
# release can therefore change CI results without a code change here.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: punch-munkey-host-portal
      - uses: actions/checkout@v7
        with:
          repository: santhoshsivakumarui-blip/punch-munkey-ui-web
          path: punch-munkey-ui-web
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - name: Assemble workspace root
        run: |
          cat > package.json <<'EOF'
          {
            "name": "ci-workspace",
            "private": true,
            "packageManager": "yarn@1.22.22",
            "workspaces": ["punch-munkey-ui-web", "punch-munkey-host-portal"]
          }
          EOF
      - run: yarn install --non-interactive
      - run: yarn workspace @punch-munkey/ui-web run build
      - run: yarn workspace punch-munkey-host-portal run lint --max-warnings 0
      - run: yarn workspace punch-munkey-host-portal run build
      - run: yarn workspace punch-munkey-host-portal run test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: punch-munkey-host-portal
      - uses: actions/checkout@v7
        with:
          repository: santhoshsivakumarui-blip/punch-munkey-ui-web
          path: punch-munkey-ui-web
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
      # The Dockerfile expects the parent folder as its build context, with
      # punch-munkey-host-portal and punch-munkey-ui-web side by side, which is the layout above.
      - run: docker build -f punch-munkey-host-portal/Dockerfile -t punch-munkey-host-portal-ci .

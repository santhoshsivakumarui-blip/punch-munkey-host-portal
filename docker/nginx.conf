server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same headers helmet adds at the api-gateway edge (see
    # jfc-services/services/api-gateway/src/index.ts) — this container has
    # no API of its own to protect, just the static SPA shell, but a
    # missing X-Content-Type-Options / X-Frame-Options here is exactly the
    # kind of gap that gets found by an audit, not a browser.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React Router (client-side routing) — any path that isn't a real
    # static file falls back to index.html so a deep link or a refresh on
    # e.g. /inventory/items/abc doesn't 404 against nginx, which has no
    # idea that route exists server-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's default) are safe to cache forever;
    # index.html itself is deliberately excluded — it must always be
    # revalidated, or a deploy could serve stale asset references.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
